<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Confere ou Confia?</title>
  <link rel="stylesheet" href="/comum.css">
  <style>
    /* Cabe na janela do celular: 100dvh é a altura visível de verdade (100vh
       conta a área atrás da barra de endereço, e é o que fazia a página
       ficar cortada). O corpo nunca rola; quem rola, se precisar, é o
       enunciado — os botões ficam sempre à vista. */
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; gap: var(--filete); height: 100vh; height: 100dvh; overflow: hidden; }
    main { display: flex; flex-direction: column; gap: var(--filete); flex: 1; min-height: 0; overflow-y: auto; }
    @media (min-width: 700px) {
      body { max-width: 1100px; margin: 0 auto; }
    }
  </style>
</head>
<body>
  <div class="cabeca etiq"><strong>Confere ou Confia?</strong><span id="marcador"></span></div>
  <main id="tela" aria-live="polite"></main>
  <script type="module" src="/quiz.js"></script>
</body>
</html>
