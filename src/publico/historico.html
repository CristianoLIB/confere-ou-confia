<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Histórico — RTQuiz</title>
  <link rel="stylesheet" href="/comum.css">
  <style>
    body { display: flex; flex-direction: column; gap: var(--filete); min-height: 100vh; max-width: 1100px; margin: 0 auto; }
    .duas { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: var(--filete); flex: 1; }
    @media (max-width: 860px) { .duas { grid-template-columns: 1fr; } }
    .lista { display: flex; flex-direction: column; gap: var(--filete); background: var(--navy-escuro); }
    .sessao {
      display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; align-items: baseline;
      padding: 16px 18px; background: var(--navy); cursor: pointer; border: none; text-align: left;
      color: var(--branco); font-family: var(--texto); width: 100%;
    }
    .sessao:hover { background: #342d6e; }
    .sessao.selecionada { background: var(--branco); color: var(--navy); }
    .sessao .quando { font-size: 15px; font-weight: 600; }
    .sessao .pct { font-family: var(--display); font-variation-settings: 'wdth' 112, 'wght' 800; font-size: 30px; }
    .sessao .sub { grid-column: 1 / 3; font-size: 12px; color: var(--lilas-claro); }
    .sessao.selecionada .sub { color: var(--texto-claro); }
    .linha { display: grid; grid-template-columns: minmax(140px, 34%) 1fr 74px; gap: 16px; align-items: center; }
    .linha .nome { font-size: 14px; font-weight: 500; }
    .linha .trilho { height: 26px; }
    .linha .parte { font-size: 12px; }
    .cartoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: var(--filete); }
    h2 { font-family: var(--display); font-variation-settings: 'wdth' 116, 'wght' 800;
         text-transform: uppercase; font-size: 20px; margin: 0 0 14px; letter-spacing: -.01em; }
  </style>
</head>
<body>
  <div class="cabeca etiq"><strong>Histórico de sessões</strong><span><a href="#" id="linkPainel" style="color: var(--lilas)">← painel</a></span></div>
  <div class="campo navy etiq" id="resumo" style="color: var(--lilas-claro)">carregando…</div>
  <div class="duas">
    <div class="lista" id="lista"></div>
    <section class="campo navy" id="detalhe" style="overflow-y: auto"></section>
  </div>
  <script type="module" src="/historico.js"></script>
</body>
</html>
